<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SarkariPixels</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #fff;
      color: #0f172a;
    }
    .header {
      background: #2563eb;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900; color: #fff;
    }
    .header-title { font-size: 15px; font-weight: 700; color: #fff; }
    .header-sub { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 1px; }
    .pill {
      margin: 12px 16px 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      font-size: 11px;
      font-weight: 600;
      color: #15803d;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      padding: 12px 16px 6px;
    }
    .tool-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      text-decoration: none;
      color: #0f172a;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.1s;
    }
    .tool-link:hover { background: #f8fafc; color: #2563eb; }
    .tool-link:last-child { border-bottom: none; }
    .tool-link .arrow { font-size: 11px; color: #94a3b8; }
    .tool-link:hover .arrow { color: #2563eb; }
    .footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid #f1f5f9;
    }
    .footer a { color: #2563eb; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    .open-btn {
      display: block;
      margin: 10px 16px;
      padding: 10px;
      background: #2563eb;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .open-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">S</div>
    <div>
      <div class="header-title">SarkariPixels</div>
      <div class="header-sub">Free Exam Photo Resizer</div>
    </div>
  </div>

  <div class="pill">
    <span class="dot"></span>
    100% Browser · Zero Upload · Free
  </div>

  <div class="section-label">Quick Launch</div>
  <div id="links"></div>

  <a href="https://www.sarkaripixels.online" target="_blank" class="open-btn">
    Open All 91 Tools →
  </a>

  <div class="footer">
    <a href="https://www.sarkaripixels.online/page/privacy" target="_blank">Privacy</a> ·
    <a href="https://www.sarkaripixels.online/exam-specs" target="_blank">Exam Specs</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
