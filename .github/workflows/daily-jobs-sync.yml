name: Daily Sarkari Jobs Sync

on:
  schedule:
    # 23:30 UTC = 05:00 AM IST (Morning release batch)
    - cron: '30 23 * * *'
    # 11:30 UTC = 05:00 PM IST (Evening release batch)
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-jobs:
    name: Sync Sarkari Recruitment Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch and update job notifications across all 4 portals
        run: node scripts/jobs-fetcher.mjs

      - name: Check for changes in data/jobs.json
        id: git_status
        run: |
          git status --porcelain data/jobs.json
          if [ -n "$(git status --porcelain data/jobs.json)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verification audit
        if: steps.git_status.outputs.has_changes == 'true'
        run: node scripts/atomic-audit-suite.mjs

      - name: Verify build with updated jobs
        if: steps.git_status.outputs.has_changes == 'true'
        run: npm run build

      - name: Commit and push changes to trigger production deployment
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore(jobs): daily sarkari recruitment alerts sync (>= 400 posts)"
          git push origin main
